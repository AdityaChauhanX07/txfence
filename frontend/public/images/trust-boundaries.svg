<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
<title>txfence trust boundaries</title>
<desc>Two zones: trusted (policy definitions, SDK code, chain adapter config) evaluated against untrusted (agent outputs, external data, user inputs, on-chain state).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="140" y="16" width="400" height="100" rx="6" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
<text x="160" y="38" font-family="ui-monospace,monospace" font-size="10" font-weight="500" letter-spacing="0.1em" fill="#666">TRUSTED</text>
<text x="160" y="58" font-family="ui-monospace,monospace" font-size="11" fill="#555">· policy definitions (written by you)</text>
<text x="160" y="76" font-family="ui-monospace,monospace" font-size="11" fill="#555">· txfence SDK code</text>
<text x="160" y="94" font-family="ui-monospace,monospace" font-size="11" fill="#555">· your chain adapter configuration</text>

<line x1="340" y1="116" x2="340" y2="156" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
<text x="356" y="140" font-family="ui-monospace,monospace" font-size="10" fill="#3a3a3a">evaluated against</text>

<rect x="140" y="160" width="400" height="108" rx="6" fill="#111" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="5 3"/>
<text x="160" y="182" font-family="ui-monospace,monospace" font-size="10" font-weight="500" letter-spacing="0.1em" fill="#555">UNTRUSTED</text>
<text x="160" y="202" font-family="ui-monospace,monospace" font-size="11" fill="#444">· agent outputs (LLM completions, tool calls)</text>
<text x="160" y="220" font-family="ui-monospace,monospace" font-size="11" fill="#444">· external data (oracles, API responses)</text>
<text x="160" y="238" font-family="ui-monospace,monospace" font-size="11" fill="#444">· user inputs fed to the agent</text>
<text x="160" y="256" font-family="ui-monospace,monospace" font-size="11" fill="#444">· on-chain state (contract return values)</text>
</svg>
